<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Teste Visual — Floresta dos Sussurros</title>
<style>
    body { background: #0a0f0a; color: #cfe8cf; font-family: Arial; margin: 0; padding: 12px; }
    canvas { border: 2px solid #2ecc71; image-rendering: pixelated; display: block; }
    #info { font-size: 13px; margin-top: 8px; }
    button { margin-right: 8px; padding: 6px 12px; background: #1e5e2a; color: #fff; border: 1px solid #2ecc71; cursor: pointer; }
</style>
</head>
<body>
<h3>🌲 Teste Visual — Floresta dos Sussurros (renderizador real do mapa_floresta.js)</h3>
<div>
    <button onclick="irPara(94000, 3000)">Vila Central (Spawn)</button>
    <button onclick="irPara(90130, 3000)">Portal Oeste</button>
    <button onclick="irPara(96200, 4180)">Lago Espelho</button>
    <button onclick="irPara(91800, 1220)">Lago das Ninfas</button>
    <button onclick="toggleColisao()">Mostrar/Ocultar Colisões</button>
</div>
<canvas id="cv" width="960" height="600"></canvas>
<div id="info"></div>
<script src="mapas-registry.js?v=1"></script>
<script src="mapas/mapa_floresta.js?v=1"></script>
<script>
    const canvas = document.getElementById('cv');
    const ctx = canvas.getContext('2d');
    // Simula o ambiente global que o renderizador do jogo espera
    window.canvas = canvas;
    window.ctx = ctx;
    window.ZOOM_CAMERA = 1;
    window.currentMap = 'floresta';
    window.camX = 94000 - 480;
    window.camY = 3000 - 300;
    let mostrarColisao = false;

    function irPara(x, y) {
        window.camX = x - canvas.width / 2;
        window.camY = y - canvas.height / 2;
    }
    function toggleColisao() { mostrarColisao = !mostrarColisao; }

    function desenharOverlayColisao() {
        const F = window.mapaFloresta;
        const g = F.grid();
        const c0 = Math.max(0, Math.floor((camX - F.FOR_X0) / 40));
        const c1 = Math.min(F.COLS - 1, Math.ceil((camX - F.FOR_X0 + canvas.width) / 40));
        const l0 = Math.max(0, Math.floor(camY / 40));
        const l1 = Math.min(F.ROWS - 1, Math.ceil((camY + canvas.height) / 40));
        for (let l = l0; l <= l1; l++) {
            for (let c = c0; c <= c1; c++) {
                const alt = g[l][c].alt;
                if (alt === 0) continue;
                ctx.fillStyle = alt >= 3 ? 'rgba(255,0,0,0.35)' : alt === 2 ? 'rgba(255,140,0,0.30)' : 'rgba(255,255,0,0.22)';
                ctx.fillRect(F.FOR_X0 + c * 40 - camX, l * 40 - camY, 40, 40);
            }
        }
    }

    function loop() {
        const t = Date.now() / 1000;
        window.desenharCenarioFloresta(t);
        if (mostrarColisao) desenharOverlayColisao();
        // marcador do spawn central
        const sx = 94000 - camX, sy = 3000 - camY;
        ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(sx, sy, 14, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = '#00e5ff'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center';
        ctx.fillText('SPAWN CENTRAL (94000, 3000)', sx, sy - 22);
        document.getElementById('info').textContent =
            'camX=' + Math.round(camX) + ' camY=' + Math.round(camY) +
            ' | Faixa do mapa: x [90000, 98000) × y [0, 6000) | Colisões: ' + (mostrarColisao ? 'visíveis' : 'ocultas');
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
